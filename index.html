<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallet Operations</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: white;
  color: #171717;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

.container {
  max-width: 1400px;
  margin: auto;
  padding: 30px;
}

/* TOP BAR */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 25px;
  border-bottom: 1px solid #e5e5e5;
}

.account {
  display: flex;
  align-items: center;
  gap: 14px;
}

.wallet {
  width: 48px;
  height: 48px;
  border: 1px solid #ddd;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}

.name {
  font-size: 18px;
  font-weight: 700;
}

.online {
  margin-top: 4px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #555;
}

.online span {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: #20a05a;
  border-radius: 50%;
  margin-right: 6px;
}

.balance-box {
  text-align: right;
}

.balance-label {
  color: #777;
  font-size: 11px;
  letter-spacing: 3px;
  font-weight: 600;
}

.balance {
  font-size: 38px;
  font-weight: 800;
  margin-top: 3px;
}

.gain {
  color: #16834a;
  font-size: 13px;
  margin-top: 4px;
}

/* STATS */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin: 28px 0;
}

.stat {
  border: 1px solid #e5e5e5;
  border-radius: 12px;
  padding: 20px;
}

.stat-title {
  color: #777;
  font-size: 11px;
  letter-spacing: 2px;
  font-weight: 600;
}

.stat-value {
  font-size: 25px;
  font-weight: 750;
  margin-top: 9px;
}

.green {
  color: #16834a;
}

/* PROGRAMS */
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.section-header h2 {
  font-size: 21px;
  margin: 0;
}

.active-count {
  color: #888;
  font-size: 12px;
}

.programs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 11px;
}

.program {
  border: 1px solid #e5e5e5;
  border-radius: 10px;
  padding: 15px;
  min-height: 95px;
}

.program-top {
  display: flex;
  justify-content: space-between;
}

.program-name {
  font-size: 12px;
  font-weight: 700;
}

.running {
  color: #16834a;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 1px;
}

.running::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  background: #20a05a;
  border-radius: 50%;
  margin-right: 5px;
}

.program-bottom {
  display: flex;
  justify-content: space-between;
  margin-top: 14px;
  color: #777;
  font-size: 10px;
}

.progress {
  height: 3px;
  background: #eeeeee;
  border-radius: 10px;
  margin-top: 10px;
  overflow: hidden;
}

.progress span {
  display: block;
  height: 100%;
  width: 30%;
  background: #222;
}

footer {
  text-align: center;
  color: #aaa;
  font-size: 10px;
  margin-top: 30px;
}

@media (max-width: 900px) {
  .programs {
    grid-template-columns: repeat(2, 1fr);
  }

  .stats {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 600px) {
  .container {
    padding: 20px 15px;
  }

  .topbar {
    align-items: flex-start;
  }

  .balance {
    font-size: 27px;
  }

  .programs,
  .stats {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- ACCOUNT -->
  <div class="topbar">

    <div class="account">

      <div class="wallet">
        💼
      </div>

      <div>
        <div class="name">
          Shayot Choudhury
        </div>

        <div class="online">
          <span></span>ONLINE
        </div>
      </div>

    </div>

    <div class="balance-box">

      <div class="balance-label">
        WALLET BALANCE
      </div>

      <div class="balance" id="balance">
        $172.00
      </div>

      <div class="gain" id="gain">
        +$0.00 this session
      </div>

    </div>

  </div>


  <!-- STATISTICS -->
  <div class="stats">

    <div class="stat">
      <div class="stat-title">RUNNING PROGRAMS</div>
      <div class="stat-value">42 / 42</div>
    </div>

    <div class="stat">
      <div class="stat-title">TOTAL ACTIVITY</div>
      <div class="stat-value" id="activity">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">SESSION UPTIME</div>
      <div class="stat-value" id="uptime">00:00:00</div>
    </div>

    <div class="stat">
      <div class="stat-title">CURRENT RATE</div>
      <div class="stat-value green" id="rate">
        $0.00 / min
      </div>
    </div>

  </div>


  <!-- PROGRAMS -->
  <div class="section-header">

    <h2>Running Programs</h2>

    <div class="active-count">
      42 active processes
    </div>

  </div>

  <div class="programs" id="programs"></div>

  <footer>
    Simulation interface
  </footer>

</div>


<script>

let balance = 172.00;
let startingBalance = 172.00;
let totalActivity = 0;

const startTime = Date.now();

const balanceElement = document.getElementById("balance");
const gainElement = document.getElementById("gain");
const activityElement = document.getElementById("activity");
const uptimeElement = document.getElementById("uptime");
const rateElement = document.getElementById("rate");

const programsContainer =
  document.getElementById("programs");


// CREATE 42 PROGRAMS
for (let i = 1; i <= 42; i++) {

  const program = document.createElement("div");

  program.className = "program";

  program.innerHTML = `

    <div class="program-top">

      <div class="program-name">
        Program ${String(i).padStart(2, "0")}
      </div>

      <div class="running">
        RUNNING
      </div>

    </div>

    <div class="program-bottom">

      <span class="activity-text">
        Processing
      </span>

      <span class="program-time">
        00:00:00
      </span>

    </div>

    <div class="progress">
      <span></span>
    </div>

  `;

  programsContainer.appendChild(program);
}


const programs =
  document.querySelectorAll(".program");


/* FORMAT TIME */

function formatTime(seconds) {

  const hours =
    Math.floor(seconds / 3600);

  const minutes =
    Math.floor((seconds % 3600) / 60);

  const secs =
    seconds % 60;

  return (
    String(hours).padStart(2, "0") +
    ":" +
    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0")
  );
}


/* UPDATE UPTIME */

function updateUptime() {

  const elapsed =
    Math.floor(
      (Date.now() - startTime) / 1000
    );

  uptimeElement.textContent =
    formatTime(elapsed);


  programs.forEach((program, index) => {

    const time =
      Math.max(0, elapsed - (index % 10));

    program.querySelector(
      ".program-time"
    ).textContent =
      formatTime(time);

  });

}


/* UPDATE PROGRAM ACTIVITY */

function updatePrograms() {

  programs.forEach((program, index) => {

    const percentage =
      25 +
      Math.floor(
        Math.random() * 70
      );

    program.querySelector(
      ".progress span"
    ).style.width =
      percentage + "%";

  });

}


/* MONEY INCREASE */

function increaseMoney() {

  /*
    Increase noticeably:
    between $0.50 and $1.50
    every 2 seconds.
  */

  const increase =
    Math.floor(
      (0.50 + Math.random() * 1.01) * 100
    ) / 100;


  balance =
    Math.round(
      (balance + increase) * 100
    ) / 100;


  const earned =
    Math.round(
      (balance - startingBalance) * 100
    ) / 100;


  totalActivity +=
    Math.floor(
      10 + Math.random() * 40
    );


  balanceElement.textContent =
    "$" + balance.toFixed(2);


  gainElement.textContent =
    "+$" + earned.toFixed(2) +
    " this session";


  activityElement.textContent =
    totalActivity.toLocaleString();


  const minutes =
    Math.max(
      (Date.now() - startTime) / 60000,
      0.033
    );


  const currentRate =
    earned / minutes;


  rateElement.textContent =
    "$" +
    currentRate.toFixed(2) +
    " / min";

}


/*
  Start immediately.
  Then increase every 2 seconds.
*/

increaseMoney();

setInterval(
  increaseMoney,
  2000
);


/*
  Uptime updates every second.
*/

setInterval(
  updateUptime,
  1000
);


/*
  Program activity updates.
*/

setInterval(
  updatePrograms,
  1500
);


updateUptime();
updatePrograms();

</script>

</body>
</html>
